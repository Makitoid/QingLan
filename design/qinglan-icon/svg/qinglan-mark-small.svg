<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="青蓝 QingLan">
  <!--
    小尺寸光学版（favicon / 任务栏 / 列表图标，16–24 px）。
    ≤24 px 时环与勾会以同权重糊成一团，这里改用以"粗细"承担层级：
    环降到 5.0 单位并提到 .85 不透明度，勾加粗到 9.0 单位，去掉容器内高光描边。
  -->
  <defs>
    <linearGradient id="ql-shell-sm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--ql-icon-1, #7DAFDB)"/>
      <stop offset=".16" stop-color="var(--ql-icon-2, #5898D1)"/>
      <stop offset=".52" stop-color="var(--ql-icon-3, #3A86C9)"/>
      <stop offset="1" stop-color="var(--ql-icon-4, #3172AB)"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="13" fill="url(#ql-shell-sm)"/>
  <path d="M43.31 33.83 A12.5 12.5 0 1 1 35.275 24.254" fill="none" stroke="#FFFFFF" stroke-opacity=".85"
        stroke-width="5" stroke-linecap="round"/>
  <path d="M26 33 L28.5 38.5 L47.6 19.3" fill="none" stroke="#FFFFFF" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
